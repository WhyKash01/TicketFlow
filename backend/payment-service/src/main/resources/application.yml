server:
  port: 8083

spring:
  application:
    name: payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ticketflow_payment}
    username: ${SPRING_DATASOURCE_USERNAME:ticketflow_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ticketflow_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 3000ms
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

ticketflow:
  booking-service:
    url: ${BOOKING_SERVICE_URL:http://localhost:8082}
  rabbitmq:
    exchange: ticketflow.topic.exchange
    payment-routing-key: payment.processed
    refund-routing-key: payment.refunded
    booking-cancelled-queue: payment.booking.cancelled.queue

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
