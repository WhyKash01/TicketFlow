version: '3.8'

services:
  # PostgreSQL Database Instance
  postgres:
    image: postgres:16-alpine
    container_name: ticketflow-postgres
    restart: always
    environment:
      POSTGRES_USER: ticketflow_user
      POSTGRES_PASSWORD: ticketflow_pass
      POSTGRES_DB: ticketflow_catalog
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    networks:
      - ticketflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketflow_user -d ticketflow_catalog"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Distributed Seat Locking and Caching
  redis:
    image: redis:7-alpine
    container_name: ticketflow-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - ticketflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker with Management Web UI
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ticketflow-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     # AMQP protocol port
      - "15672:15672"   # Management Web UI port
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    networks:
      - ticketflow-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  # pgAdmin 4 - Web-based PostgreSQL Management GUI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ticketflow-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ticketflow.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - ticketflow-network
    depends_on:
      - postgres

volumes:
  pgdata:
  redisdata:
  rabbitdata:

networks:
  ticketflow-network:
    driver: bridge

